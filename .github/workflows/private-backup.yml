name: Private daily backup
on:
  schedule:
    - cron: '0 10 * * *' # Approximately 03:00 America/Phoenix; GitHub schedules can be delayed.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saddle-school-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Create encrypted records and media backup
        env:
          SUPABASE_URL: ${{ secrets.SADDLE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SADDLE_SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.SADDLE_BACKUP_PASSPHRASE }}
        run: node scripts/backup.mjs
      - name: Install Drive transfer tool
        run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Copy encrypted backup to private Google Drive
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.SADDLE_RCLONE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          config_file="$RUNNER_TEMP/saddle-rclone.conf"
          umask 077
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$config_file"
          rclone --config "$config_file" copy backup-output/ saddle-drive:Saddle-School-Backups --immutable
          rclone --config "$config_file" check backup-output/ saddle-drive:Saddle-School-Backups --one-way --download
          rm "$config_file"
